<!DOCTYPE html>
<html lang="zh-TW">
<head>

    <title>課後作業</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Noto Sans TC', "PingFang TC", "Microsoft JhengHei", sans-serif; }

<body class="bg-slate-50 text-slate-800 antialiased min-h-screen pb-12">
    <header class="bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-900 text-white py-10 px-4 sm:px-6 lg:px-8 shadow-md">
        <div class="max-w-4xl mx-auto text-center">
            <span class="inline-block px-3 py-1 bg-indigo-500/30 text-indigo-300 rounded-full text-sm font-medium mb-3 border border-indigo-400/30">第 3 堂課後｜為第 4 堂（2026/09/30）設計思考文獻探討準備</span>
            <h1 class="text-3xl sm:text-4xl font-bold tracking-tight mb-3">課後作業</h1>
            <p class="text-slate-300 max-w-2xl mx-auto">下一堂要討論的內容</p>
        </div>
    </header>
    <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 mt-10 space-y-8">
        <section class="rounded-xl bg-indigo-50 border border-indigo-200 p-4 text-sm text-indigo-900">
            <i class="fa-solid fa-book-open mr-2"></i>第 4 堂要討論的論文 Micheli et al. (2019)，已在<a href="../week02/#3" target="_top" class="underline underline-offset-2 font-medium">第二堂「課後作業」</a>公布，請先完成閱讀。
        </section>
        <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8">
            <h2 class="text-xl font-bold text-slate-900 mb-4 flex items-center gap-3"><i class="fa-solid fa-clipboard-list text-indigo-600"></i>作業</h2>
            <div class="flex gap-3">
                <span class="shrink-0 w-7 h-7 rounded-full bg-indigo-600 text-white text-sm font-bold flex items-center justify-center">1</span>
                <div>
                    <p class="font-bold">用三個資料庫查「設計的定義」</p>
                    <p class="text-sm text-slate-600">分別用 Web of Science、Scopus、Google Scholar 查「設計的定義」（the definition of design），比較三個資料庫找到的結果有什麼不同，並寫下你的結論：設計是什麼？</p>
                    <p class="text-sm text-slate-500 mt-2">提示：先依分頁 4「學術資料庫比較」的「上課補充」把題目拆成幾個概念再查。</p>
                </div>
            </div>
        </section>
    </main>
