<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QDS 2026 課程講義</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F4; --bar:#FFFFFF; --ink:#1B2533; --muted:#5F6B7A; --line:#D5DBE2;
  --accent:#1F5F8B; --accent-soft:#E3EDF5; --num:#8A96A5;
  --hero1:#0c3b5e; --hero2:#0f172a;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12171E; --bar:#1A212B; --ink:#E4E9EF; --muted:#9AA6B4; --line:#2C3542;
    --accent:#7FB6DE; --accent-soft:#223244; --num:#6D7A8A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12171E; --bar:#1A212B; --ink:#E4E9EF; --muted:#9AA6B4; --line:#2C3542;
  --accent:#7FB6DE; --accent-soft:#223244; --num:#6D7A8A; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);min-height:100vh;
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.hero{
  background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#fff;
  padding:calc(2.5rem + env(safe-area-inset-top,0px)) 1rem 2.25rem;
}
.wrap{max-width:68rem;margin:0 auto;padding:0 1rem}
.hero .wrap{padding:0}
.hero .tag{
  display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.08em;
  padding:.2rem .65rem;border-radius:999px;background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.25);margin-bottom:.8rem;
}
.hero h1{margin:0;font-size:clamp(1.5rem,4vw,2.1rem);font-weight:700;letter-spacing:.01em}
.hero p{margin:.5rem 0 0;color:#CBD5E1;font-size:.95rem}
main.wrap{padding-top:1.75rem;padding-bottom:3rem}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;margin:0 0 1rem}
.sec h2{margin:0;font-size:1.05rem}
.sec span{font-size:.85rem;color:var(--muted)}
.grid{list-style:none;margin:0;padding:0;display:grid;gap:.85rem;grid-template-columns:repeat(auto-fill,minmax(15.5rem,1fr));align-items:start}
.card{
  display:flex;flex-direction:column;height:100%;
  background:var(--bar);border:1px solid var(--line);border-radius:12px;
  padding:1rem 1.1rem;color:inherit;text-decoration:none;
  transition:border-color .15s,box-shadow .15s,transform .15s;
}
a.card:hover{border-color:var(--accent);box-shadow:0 6px 20px rgba(20,40,70,.12);transform:translateY(-1px)}
a.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.head{display:flex;align-items:center;gap:.65rem}
.no{
  flex:none;width:2.4rem;height:2.4rem;border-radius:10px;display:grid;place-items:center;
  font-weight:700;font-variant-numeric:tabular-nums;background:var(--accent);color:var(--bar);
}
.head b{font-size:1rem}
.head small{display:block;font-size:.78rem;color:var(--muted);margin-top:.1rem}
.new{
  margin-left:auto;font-size:.7rem;font-weight:700;color:var(--accent);
  background:var(--accent-soft);border-radius:999px;padding:.15rem .55rem;
}
.card ol{margin:.85rem 0 0;padding:0;list-style:none;counter-reset:d;font-size:.85rem;line-height:1.5}
.card ol li{counter-increment:d;display:flex;gap:.5rem;padding:.12rem 0}
.card ol li::before{content:counter(d);flex:none;width:1.1rem;color:var(--num);font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.meta{margin-top:auto;padding-top:.85rem;font-size:.78rem;color:var(--muted);display:flex;justify-content:space-between;gap:.5rem}
.meta em{font-style:normal;color:var(--accent);font-weight:500}
.card.off{background:transparent;border-style:dashed}
.card.off .no{background:var(--accent-soft);color:var(--num)}
.card.off .head b{color:var(--muted);font-weight:500}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:.8rem;padding:1rem 0 1.5rem}
@media (max-width:560px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="hero">
  <div class="wrap">
    <span class="tag">QDS 2026</span>
    <h1>Qualitative Design Studies 課程講義</h1>
    <p>授課：唐玄輝 Hsien-Hui TANG</p>
  </div>
</header>
<main class="wrap">
  <div class="sec"><h2>各堂講義</h2><span>/*SUMMARY*/</span></div>
  <ol class="grid">
/*WEEKS*/
  </ol>
</main>
<footer><div class="wrap">網站最後更新：/*UPDATED*/</div></footer>
</body>
</html>
